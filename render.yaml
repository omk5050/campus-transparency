services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. ETHOS Backend Web Service (Spring Boot 3.5 / Java 21)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: ethos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. ETHOS Frontend Static Site (React 18 / Vite / Tailwind)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: ethos-frontend
    runtime: static
    buildCommand: cd frontendv2 && npm install && npm run build
    staticPublishPath: ./frontendv2/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
