spring:
  application:
    name: campus-transparency-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-mute-unit-a14szfx7.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  sql:
    init:
      mode: never
