spring:
  application:
    name: campus-transparency-test
  profiles:
    active: test

  datasource:
    url: jdbc:postgresql://localhost:5432/campus_transparency_test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations:
      - classpath:db/migration
      - classpath:db/test-migration

  sql:
    init:
      mode: never

app:
  rate-limiting:
    enabled: false

zonky:
  test:
    database:
      provider: zonky
      type: postgres
      replace: any

